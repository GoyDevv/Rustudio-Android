name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XBUILD_REV: e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1

jobs:
  android-checks:
    name: Android Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"

      - name: Validate manifest, api-dump.json & Java/DEX compilation
        run: |
          set -euo pipefail
          test -f api-dump.json
          size=$(stat -c%s api-dump.json)
          test "$size" -ge 1048576 || { echo "ERROR: api-dump.json too small ($size bytes)"; exit 1; }

          python3 - << 'PY'
          import re
          from pathlib import Path
          cargo_ver = re.search(r'version\s*=\s*"([^"]+)"', Path("Cargo.toml").read_text()).group(1)
          manifest = Path("crates/rustudio-android/manifest.yaml").read_text()
          m_ver = re.search(r'version_name:\s*"v?([^"]+)"', manifest).group(1)
          assert cargo_ver == m_ver, f"Version mismatch: Cargo.toml={cargo_ver} vs manifest.yaml={m_ver}"
          bad = [str(p) for p in Path("crates/rustudio-android/libs").rglob("*.so")]
          assert not bad, f"Unexpected third-party .so files in libs/: {bad}"
          print(f"OK: version={cargo_ver}, clean native-only libs/")
          PY

          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          D8="$ANDROID_HOME/build-tools/33.0.2/d8"
          mkdir -p /tmp/java-check /tmp/dex-check
          javac --release 11 -Xlint:deprecation -classpath "$ANDROID_JAR" -d /tmp/java-check \
            crates/rustudio-android/java/com/logosforgestudios/rustudio/RustudioActivity.java
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex-check \
            /tmp/java-check/com/logosforgestudios/rustudio/*.class
          ls -lh /tmp/dex-check/classes.dex

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-unit-checks

      - name: Install Linux audio/input dev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev

      - name: Run core, API, IntelliSense & import unit tests
        env:
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_INCREMENTAL: 0
        run: |
          cargo test -p rustudio-core --lib api
          cargo test -p rustudio-core --lib rustudio_settings
          cargo test --lib luau_intellisense
          cargo test --lib import_studio

  build-arch:
    name: Build Native Lib (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config libasound2-dev zstd

      - name: Cache Cargo & xbuild NDK
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release-${{ matrix.arch }}
          workspaces: ". -> target/x/release/android/${{ matrix.arch }}/cargo"
          cache-directories: |
            ~/.cache/x

      - name: Cache xbuild binary
        id: xbuild-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/x
          key: xbuild-${{ runner.os }}-${{ env.XBUILD_REV }}

      - name: Install xbuild
        if: steps.xbuild-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/rust-mobile/xbuild --rev "$XBUILD_REV" xbuild

      - name: Compile RustudioActivity.java to classes.dex
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          D8="$ANDROID_HOME/build-tools/33.0.2/d8"
          mkdir -p /tmp/java-classes /tmp/dex-out
          javac --release 11 -classpath "$ANDROID_JAR" -d /tmp/java-classes \
            crates/rustudio-android/java/com/logosforgestudios/rustudio/RustudioActivity.java
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex-out \
            /tmp/java-classes/com/logosforgestudios/rustudio/*.class
          cp /tmp/dex-out/classes.dex crates/rustudio-android/classes.dex

      - name: Build release APK for ${{ matrix.arch }}
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          x build -p rustudio-android --platform android --arch "${{ matrix.arch }}" --format apk --release
          apk="target/x/release/android/rustudio-android.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/raw-${{ matrix.arch }}.apk"

      - name: Upload intermediate arch APK
        uses: actions/upload-artifact@v4
        with:
          name: raw-apk-${{ matrix.arch }}
          path: dist/raw-${{ matrix.arch }}.apk
          if-no-files-found: error
          retention-days: 1

  universal-apk:
    name: Universal Release APK (arm64 + x64)
    needs: [build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-33 build-tools;33.0.2"

      - name: Download arm64 raw APK
        uses: actions/download-artifact@v4
        with:
          name: raw-apk-arm64
          path: dist

      - name: Download x64 raw APK
        uses: actions/download-artifact@v4
        with:
          name: raw-apk-x64
          path: dist

      - name: Compile fresh classes.dex
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          D8="$ANDROID_HOME/build-tools/33.0.2/d8"
          mkdir -p /tmp/java-classes /tmp/dex-out
          javac --release 11 -classpath "$ANDROID_JAR" -d /tmp/java-classes \
            crates/rustudio-android/java/com/logosforgestudios/rustudio/RustudioActivity.java
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/dex-out \
            /tmp/java-classes/com/logosforgestudios/rustudio/*.class
          cp /tmp/dex-out/classes.dex dist/classes.dex

      - name: Merge arm64 + x64 into Universal APK, 4KB align & sign
        id: pack
        env:
          SIGNING_PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
        run: |
          set -euo pipefail
          VER=$(python3 -c 'import re, pathlib; print(re.search(r"version\s*=\s*\"([^\"]+)\"", pathlib.Path("Cargo.toml").read_text()).group(1))')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          ZIPALIGN="$ANDROID_HOME/build-tools/33.0.2/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          ARM64="dist/raw-arm64.apk"
          X64="dist/raw-x64.apk"
          MERGED="dist/merged-universal.apk"
          FINAL="dist/rustudio-v${VER}-universal-release.apk"

          python3 - "$ARM64" "$X64" "$MERGED" "dist/classes.dex" << 'PY'
          import sys, zipfile
          arm64_apk, x64_apk, dst, dex_path = sys.argv[1:5]
          stored = (".so", ".arsc", "classes.dex")
          written = set()

          with zipfile.ZipFile(arm64_apk, "r") as zarm, \
               zipfile.ZipFile(x64_apk, "r") as zx64, \
               zipfile.ZipFile(dst, "w") as zout:

              # Copy everything from arm64 APK except classes.dex and old signatures
              for item in zarm.infolist():
                  n = item.filename
                  if n == "classes.dex":
                      continue
                  if n.startswith("META-INF/") and (
                      n.endswith((".SF", ".RSA", ".DSA", ".EC")) or n == "META-INF/MANIFEST.MF"
                  ):
                      continue
                  zi = zipfile.ZipInfo(n)
                  zi.compress_type = zipfile.ZIP_STORED if n.endswith(stored) else zipfile.ZIP_DEFLATED
                  zout.writestr(zi, zarm.read(n))
                  written.add(n)

              # Merge x86_64 native libraries from x64 APK
              for item in zx64.infolist():
                  n = item.filename
                  if not n.startswith("lib/x86_64/") or n in written:
                      continue
                  zi = zipfile.ZipInfo(n)
                  zi.compress_type = zipfile.ZIP_STORED
                  zout.writestr(zi, zx64.read(n))
                  written.add(n)

              # Pack fresh uncompressed classes.dex
              zi = zipfile.ZipInfo("classes.dex")
              zi.compress_type = zipfile.ZIP_STORED
              with open(dex_path, "rb") as f:
                  zout.writestr(zi, f.read())
          PY

          "$ZIPALIGN" -p -f 4 "$MERGED" "$FINAL"

          if [ -n "${SIGNING_PEM:-}" ]; then
            printf '%s\n' "$SIGNING_PEM" > /tmp/signing.pem
            openssl pkcs12 -export -in /tmp/signing.pem -inkey /tmp/signing.pem \
              -out /tmp/signing.p12 -name rustudio -passout pass:rustudio_ci
            "$APKSIGNER" sign --ks /tmp/signing.p12 --ks-type PKCS12 \
              --ks-pass pass:rustudio_ci --key-pass pass:rustudio_ci \
              --v1-signing-enabled true --v2-signing-enabled true "$FINAL"
            rm -f /tmp/signing.pem /tmp/signing.p12
          else
            keytool -genkeypair -v -keystore /tmp/ci-test.jks -storepass android \
              -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Rustudio CI Test"
            "$APKSIGNER" sign --ks /tmp/ci-test.jks --ks-pass pass:android \
              --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true "$FINAL"
            rm -f /tmp/ci-test.jks
          fi

          "$APKSIGNER" verify --verbose "$FINAL"
          rm -f "$ARM64" "$X64" "$MERGED" "dist/classes.dex"

      - name: Verify Universal APK contents (arm64-v8a + x86_64)
        run: |
          python3 - "dist/rustudio-v${{ steps.pack.outputs.version }}-universal-release.apk" << 'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk, "r") as z:
              names = z.namelist()
              assert "assets/api-dump.json" in names, "assets/api-dump.json missing"
              assert z.getinfo("assets/api-dump.json").file_size >= 1024 * 1024, "api-dump.json too small"
              assert "classes.dex" in names, "classes.dex missing"
              assert z.getinfo("classes.dex").compress_type == zipfile.ZIP_STORED, "classes.dex not stored"
              sos = sorted(n for n in names if n.endswith(".so"))
              assert any(s.startswith("lib/arm64-v8a/") for s in sos), f"missing arm64-v8a .so in {sos}"
              assert any(s.startswith("lib/x86_64/") for s in sos), f"missing x86_64 .so in {sos}"
              for s in sos:
                  low = s.lower()
                  assert not any(b in low for b in ("turnip", "freedreno", "panvk", "panfrost", "adrenotools", "hook_impl", "main_hook")), f"forbidden lib: {s}"
                  assert z.getinfo(s).compress_type == zipfile.ZIP_STORED, f"{s} not stored"
              print("VERIFIED UNIVERSAL APK:", apk, "libs:", sos)
          PY

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rustudio-v${{ steps.pack.outputs.version }}-universal-release
          path: dist/rustudio-v${{ steps.pack.outputs.version }}-universal-release.apk
          if-no-files-found: error
          retention-days: 14
