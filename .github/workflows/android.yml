name: Android

# Release-only test APKs for arm64-v8a and x86_64 using native Android graphics
# drivers ONLY (no Turnip, PanVK, or libadrenotools). Never publishes to GitHub
# Releases — uploads release APKs as workflow artifacts for testing.

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "api-dump.json"
      - "mechanics.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "vendor/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "api-dump.json"
      - "mechanics.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  XBUILD_REV: e67b501cbe0e9ca5436c223aa7ec0fe5e27544d1

jobs:
  apk:
    name: APK ${{ matrix.arch }} release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config libasound2-dev zstd

      - name: Cache cargo registry and per-target build dir
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.arch }}-release
          workspaces: ". -> target/x/release/android/${{ matrix.arch }}/cargo"
          cache-directories: |
            ~/.cache/x

      - name: Cache xbuild binary
        id: xbuild-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/x
          key: xbuild-${{ runner.os }}-${{ env.XBUILD_REV }}

      - name: Install xbuild
        if: steps.xbuild-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/rust-mobile/xbuild --rev "$XBUILD_REV" xbuild

      - name: x doctor
        run: x doctor

      - name: Compile RustudioActivity.java to classes.dex
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar"
          D8="$ANDROID_HOME/build-tools/33.0.2/d8"
          mkdir -p /tmp/rustudio-java-classes /tmp/rustudio-dex
          javac --release 11 -classpath "$ANDROID_JAR" -d /tmp/rustudio-java-classes \
            crates/rustudio-android/java/com/logosforgestudios/rustudio/RustudioActivity.java
          "$D8" --min-api 26 --lib "$ANDROID_JAR" --output /tmp/rustudio-dex \
            /tmp/rustudio-java-classes/com/logosforgestudios/rustudio/*.class
          cp /tmp/rustudio-dex/classes.dex crates/rustudio-android/classes.dex
          ls -lh crates/rustudio-android/classes.dex

      - name: Build release APK
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          set -euo pipefail
          x build -p rustudio-android --platform android --arch "${{ matrix.arch }}" --format apk --release
          apk="target/x/release/android/rustudio-android.apk"
          test -f "$apk"
          mkdir -p dist
          cp "$apk" "dist/rustudio-${{ matrix.arch }}-release-raw.apk"

      - name: Pack classes.dex, align 4KB uncompressed native libs & sign APK
        env:
          SIGNING_PEM: ${{ secrets.ANDROID_SIGNING_PEM }}
        run: |
          set -euo pipefail
          ZIPALIGN="$ANDROID_HOME/build-tools/33.0.2/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/33.0.2/apksigner"
          RAW="dist/rustudio-${{ matrix.arch }}-release-raw.apk"
          REPACKED="dist/rustudio-${{ matrix.arch }}-release-repacked.apk"
          ALIGNED="dist/rustudio-${{ matrix.arch }}-release.apk"

          python3 - "$RAW" "$REPACKED" "crates/rustudio-android/classes.dex" << 'PY'
          import sys, zipfile

          src, dst, dex_path = sys.argv[1], sys.argv[2], sys.argv[3]
          stored_suffixes = (".so", ".arsc", "classes.dex")

          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dst, "w") as zout:
              for item in zin.infolist():
                  name = item.filename
                  # Drop old signatures and old classes.dex (we inject fresh classes.dex below)
                  if name.startswith("META-INF/") and (
                      name.endswith(".SF") or name.endswith(".RSA") or name.endswith(".DSA")
                      or name.endswith(".EC") or name == "META-INF/MANIFEST.MF"
                  ):
                      continue
                  if name == "classes.dex":
                      continue
                  data = zin.read(name)
                  compress = zipfile.ZIP_STORED if name.endswith(stored_suffixes) else zipfile.ZIP_DEFLATED
                  zi = zipfile.ZipInfo(name)
                  zi.compress_type = compress
                  zout.writestr(zi, data)

              with open(dex_path, "rb") as f:
                  dex_bytes = f.read()
              zi = zipfile.ZipInfo("classes.dex")
              zi.compress_type = zipfile.ZIP_STORED
              zout.writestr(zi, dex_bytes)
          PY

          "$ZIPALIGN" -p -f 4 "$REPACKED" "$ALIGNED"

          if [ -n "${SIGNING_PEM:-}" ]; then
            printf '%s\n' "$SIGNING_PEM" > /tmp/signing.pem
            openssl pkcs12 -export -in /tmp/signing.pem -inkey /tmp/signing.pem \
              -out /tmp/signing.p12 -name rustudio -passout pass:rustudio_ci
            "$APKSIGNER" sign --ks /tmp/signing.p12 --ks-type PKCS12 \
              --ks-pass pass:rustudio_ci --key-pass pass:rustudio_ci \
              --v1-signing-enabled true --v2-signing-enabled true "$ALIGNED"
            rm -f /tmp/signing.pem /tmp/signing.p12
          else
            keytool -genkeypair -v -keystore /tmp/ci-test.jks -storepass android \
              -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=Rustudio CI Test"
            "$APKSIGNER" sign --ks /tmp/ci-test.jks --ks-pass pass:android \
              --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true "$ALIGNED"
            rm -f /tmp/ci-test.jks
          fi

          "$APKSIGNER" verify --verbose "$ALIGNED"
          rm -f "$RAW" "$REPACKED"
          ls -lh "$ALIGNED"

      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk="dist/rustudio-${{ matrix.arch }}-release.apk"
          unzip -lv "$apk" | grep -E "lib/|assets/|classes\.dex|resources\.arsc|AndroidManifest" || true

          # Must contain assets/api-dump.json (> 1 MiB)
          python3 - "$apk" << 'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk, "r") as z:
              names = z.namelist()
              if "assets/api-dump.json" not in names:
                  sys.exit("ERROR: assets/api-dump.json missing from APK")
              api_info = z.getinfo("assets/api-dump.json")
              if api_info.file_size < 1024 * 1024:
                  sys.exit(f"ERROR: assets/api-dump.json too small ({api_info.file_size} bytes)")
              if "classes.dex" not in names:
                  sys.exit("ERROR: classes.dex missing from APK")
              dex_info = z.getinfo("classes.dex")
              if dex_info.compress_type != zipfile.ZIP_STORED:
                  sys.exit("ERROR: classes.dex must be ZIP_STORED (uncompressed)")
              so_files = [n for n in names if n.endswith(".so")]
              if not so_files:
                  sys.exit("ERROR: no .so native libraries found in APK")
              for so in so_files:
                  low = so.lower()
                  if any(bad in low for bad in ("turnip", "freedreno", "panvk", "panfrost", "adrenotools", "hook_impl", "main_hook")):
                      sys.exit(f"ERROR: forbidden third-party driver found in APK: {so}")
                  if z.getinfo(so).compress_type != zipfile.ZIP_STORED:
                      sys.exit(f"ERROR: native library {so} must be ZIP_STORED (uncompressed)")
              print(f"OK: verified {apk} (api-dump.json={api_info.file_size}B, classes.dex={dex_info.file_size}B, native_libs={so_files})")
          PY

      - name: Upload release test APK
        uses: actions/upload-artifact@v4
        with:
          name: rustudio-${{ matrix.arch }}-release.apk
          path: dist/rustudio-${{ matrix.arch }}-release.apk
          if-no-files-found: error
          retention-days: 14

  desktop-still-builds:
    name: Desktop check (cfg gates)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-desktop-check
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev
      - run: cargo check --workspace --all-targets
